      <stop offset="0" stop-color="#f0637a" stop-opacity="0.62"/>
      <stop offset="0.55" stop-color="#ee6f84" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ec7a8c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="60" cy="60" rx="60" ry="46" fill="url(#cheek)"/>
